deepstream_node:
  ros__parameters:
    mode: sahi
    sources:
      - /opt/nvidia/deepstream/deepstream/samples/streams/sample_720p.mp4
      - /opt/nvidia/deepstream/deepstream/samples/streams/sample_720p.mp4
      - /opt/nvidia/deepstream/deepstream/samples/streams/sample_720p.mp4
    source_names: [camera_0, camera_1, camera_2]
    file_loop: true
    width: 1280
    height: 720
    slice_width: 640
    slice_height: 640
    overlap_h: 0.2
    overlap_v: 0.2
    pgie_batch_size: 1
    det_interval: 2
    merge_enabled: true
    merge_metric: ios
    merge_threshold: 0.5
    tracker_enabled: true
    tracker_config: config/deepstream_tracker_iou_config.txt
    display: false
    publish_detections: true
    publish_annotated: false
    publish_best_target: false
