deepstream_node:
  ros__parameters:
    mode: sahi
    sources:
      - /dev/v4l/by-path/platform-tegra-capture-vi-video-index0
      - /dev/v4l/by-path/platform-tegra-capture-vi-video-index6
      - /dev/v4l/by-path/platform-tegra-capture-vi-video-index8
    source_names: [camera_0, camera_1, camera_2]
    source_rotations: [180, 180, 180]
    file_loop: false
    camera_fps: 30
    v4l2_pixel_format: UYVY
    width: 1920
    height: 1080
    slice_width: 640
    slice_height: 640
    overlap_h: 0.2
    overlap_v: 0.2
    rois: "[[0,220,640,640], [640,220,640,640], [1280,220,640,640]]"
    include_full_frame: true
    pgie_batch_size: 1
    det_interval: 2
    merge_enabled: true
    merge_metric: ios
    merge_threshold: 0.5
    tracker_enabled: true
    tracker_config: config/deepstream_tracker_iou_config.txt
    display: false
    publish_detections: false
    publish_annotated: false
    allowed_class_ids: [0]
