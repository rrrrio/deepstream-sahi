deepstream_node:
  ros__parameters:
    mode: sahi
    sources:
      - /opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
      - /opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
      - /opt/nvidia/deepstream/deepstream/samples/streams/sample_1080p_h264.mp4
    source_names: [camera_0, camera_1, camera_2]
    file_loop: true
    width: 1920
    height: 1080
    slice_width: 640
    slice_height: 640
    overlap_h: 0.2
    overlap_v: 0.2
    pgie_batch_size: 1
    det_interval: 2
    merge_enabled: true
    merge_metric: ios
    merge_threshold: 0.5
    tracker_enabled: true
    display: true
    publish_detections: false
    publish_annotated: false
    allowed_class_ids: []
